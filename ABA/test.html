<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ABA PayWay Sandbox Test</title>

    <!-- PayWay plugin: bottom sheet on mobile, modal on desktop -->
    <script src="https://checkout.payway.com.kh/plugins/checkout2-0.js" defer></script>

    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f7;
        color: #1a1a1a;
      }
      main {
        width: min(92vw, 440px);
        background: #fff;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }
      p {
        line-height: 1.5;
        margin: 8px 0;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        margin-top: 12px;
        border: 0;
        border-radius: 9px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: #0b5fff;
        color: #fff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      button.secondary {
        background: #e8ecf4;
        color: #1a1a1a;
      }
      code {
        background: #f0f2f6;
        padding: 2px 6px;
        border-radius: 5px;
        font-size: 0.85rem;
      }
      pre {
        margin-top: 14px;
        padding: 12px;
        border-radius: 9px;
        background: #10151f;
        color: #d6e2ff;
        font-size: 0.8rem;
        overflow: auto;
        max-height: 240px;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ABA PayWay Sandbox</h1>
      <p class="muted">
        Merchant <code>ec480150</code> &middot; Amount <code>USD 0.10</code>
      </p>

      <p id="status" role="status"></p>
      <p id="tran" class="muted"></p>

      <button id="pay" type="button">Pay USD 0.10</button>
      <button id="check" class="secondary" type="button" disabled>
        Check last transaction
      </button>

      <pre id="result" hidden></pre>

      <p class="muted" style="margin-top: 18px">
        Test cards: <code>4286 0900 0000 0206</code> (04/30, CVV 777, 3DS) or
        <code>5156 8399 3770 6777</code> (01/30, CVV 993).
      </p>
    </main>

    <form
      method="POST"
      target="aba_webservice"
      id="aba_merchant_request"
      action="https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase"
    >
      <!-- Hidden inputs are injected with a freshly signed transaction. -->
    </form>

    <script>
      const form = document.getElementById('aba_merchant_request');
      const payButton = document.getElementById('pay');
      const checkButton = document.getElementById('check');
      const statusEl = document.getElementById('status');
      const tranEl = document.getElementById('tran');
      const resultEl = document.getElementById('result');

      let tranId = null;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = isError ? 'error' : '';
      }

      function injectFields(fields) {
        form.replaceChildren();
        for (const [name, value] of Object.entries(fields)) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        }
      }

      async function createPayment() {
        const res = await fetch('/api/create-payment', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      async function pay() {
        payButton.disabled = true;
        resultEl.hidden = true;
        setStatus('Creating transaction…');

        try {
          const fields = await createPayment();
          injectFields(fields);

          tranId = fields.tran_id;
          tranEl.textContent = 'Transaction ID: ' + tranId;
          checkButton.disabled = false;

          if (window.AbaPayway) {
            setStatus('Opening checkout…');
            AbaPayway.checkout();
          } else {
            // Plugin blocked or failed to load: fall back to hosted view.
            setStatus('Plugin unavailable — opening hosted checkout…');
            form.submit();
          }
        } catch (err) {
          setStatus('Error: ' + err.message, true);
        } finally {
          payButton.disabled = false;
        }
      }

      async function checkStatus() {
        if (!tranId) return;
        checkButton.disabled = true;
        setStatus('Checking transaction…');

        try {
          const res = await fetch('/api/check-transaction', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tran_id: tranId }),
          });
          const data = await res.json();
          resultEl.hidden = false;
          resultEl.textContent = JSON.stringify(data, null, 2);
          setStatus(res.ok ? 'Status received.' : 'Check failed.');
        } catch (err) {
          setStatus('Error: ' + err.message, true);
        } finally {
          checkButton.disabled = false;
        }
      }

      payButton.addEventListener('click', pay);
      checkButton.addEventListener('click', checkStatus);

      // If something else submits the form, use the plugin when available.
      form.addEventListener('submit', (event) => {
        if (window.AbaPayway) {
          event.preventDefault();
          AbaPayway.checkout();
        }
      });
    </script>
  </body>
</html>
