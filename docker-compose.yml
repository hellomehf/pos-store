services:
  database:
    image: mysql:8.0
    container_name: pos_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pos_system
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    volumes:
      - pos_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: pos_system
      DB_USERNAME: pos_user
      DB_PASSWORD: pos_password
    volumes:
      - ./backend/.env:/var/www/.env
      - pos_storage:/var/www/storage/app/public
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  pos_mysql_data:
  pos_storage:
